# Redis for IP Dokan: sessions, OTP codes, rate limits, BullMQ queues and Socket.IO across processes.
# Started by deploy/server-setup.sh, which passes REDIS_PASSWORD from /var/www/ipdokan/.env.
# Reachable only from the VPS itself (127.0.0.1), with a password (REDIS_PASSWORD in /var/www/ipdokan/.env).
name: ipdokan
services:
  redis:
    image: redis:7.4-alpine
    container_name: ipdokan-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD missing in .env}
      # Kept on disk, so queued jobs and sessions survive a restart.
      - --appendonly
      - "yes"
      - --maxmemory
      - 1gb
      # BullMQ requires that Redis never drops keys on its own.
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
volumes:
  redis-data:
