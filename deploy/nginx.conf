# Rate limits per visitor IP (shared by all locations below). Requests over the limit get 429.
#   api:  20 requests/second, bursts of 60 (a page load makes several API calls)
#   auth: 5 requests/second for sign-in, sign-up and OTP endpoints, bursts of 10
limit_req_zone $binary_remote_addr zone=ipdokan_api:20m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ipdokan_auth:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=ipdokan_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# Cloudflare sits in front of the site. Without this, nginx sees Cloudflare's IP on every request, so the
# rate limits above would be shared by all visitors. These lines trust Cloudflare's own IP ranges and read
# the real visitor IP from the CF-Connecting-IP header, so $binary_remote_addr is the real client again.
# Ranges from https://www.cloudflare.com/ips/ (update if Cloudflare changes them).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Micro-cache for the public product list. /api/products is the same for everyone and is the slowest,
# DB-backed endpoint, so caching it for a few seconds shields MongoDB from traffic spikes (and floods).
# The directory is created by deploy/server-setup.sh.
proxy_cache_path /var/cache/nginx/ipdokan levels=1:2 keys_zone=ipdokan_products:10m max_size=100m inactive=120s use_temp_path=off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ipdokan.com www.ipdokan.com;

    client_max_body_size 10m;
    # At most 100 open connections per visitor IP (WebSocket included).
    limit_conn ipdokan_conn 100;

    # Do not reveal the nginx version in the Server header or error pages.
    server_tokens off;

    # Security headers on every response (locations without their own add_header inherit these).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Maintenance page. Shown while /var/www/ipdokan-maintenance/on exists (deploys, or
    # `bash deploy/maintenance.sh on`), and whenever the app is down or restarting (502/504).
    set $maintenance 0;
    if (-f /var/www/ipdokan-maintenance/on) { set $maintenance 1; }
    error_page 502 503 504 @maintenance;
    location @maintenance {
        root /var/www/ipdokan-maintenance;
        try_files /index.html =503;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "120" always;
    }

    # Health check stays reachable during maintenance (the deploy script uses it).
    location = /api/health {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
    }

    # Public product list: served from the micro-cache. A cache miss fetches once and every other request
    # in the same few seconds is answered from memory, so a flood here never reaches MongoDB.
    location = /api/products {
        if ($maintenance) { return 503; }
        limit_req zone=ipdokan_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache ipdokan_products;
        proxy_cache_valid 200 15s;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Socket.IO (live notifications and cart): WebSocket upgrade, long-lived connections.
    location /api/socket.io/ {
        if ($maintenance) { return 503; }
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/auth/ {
        if ($maintenance) { return 503; }
        limit_req zone=ipdokan_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        if ($maintenance) { return 503; }
        limit_req zone=ipdokan_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        if ($maintenance) { return 503; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
