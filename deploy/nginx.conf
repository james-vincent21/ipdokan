# Rate limits per visitor IP (shared by all locations below). Requests over the limit get 429.
#   api:  20 requests/second, bursts of 60 (a page load makes several API calls)
#   auth: 5 requests/second for sign-in, sign-up and OTP endpoints, bursts of 10
limit_req_zone $binary_remote_addr zone=ipdokan_api:20m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ipdokan_auth:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=ipdokan_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ipdokan.com www.ipdokan.com;

    client_max_body_size 10m;
    # At most 100 open connections per visitor IP (WebSocket included).
    limit_conn ipdokan_conn 100;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Maintenance page. Shown while /var/www/ipdokan-maintenance/on exists (deploys, or
    # `bash deploy/maintenance.sh on`), and whenever the app is down or restarting (502/504).
    set $maintenance 0;
    if (-f /var/www/ipdokan-maintenance/on) { set $maintenance 1; }
    error_page 502 503 504 @maintenance;
    location @maintenance {
        root /var/www/ipdokan-maintenance;
        try_files /index.html =503;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "120" always;
    }

    # Health check stays reachable during maintenance (the deploy script uses it).
    location = /api/health {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
    }

    # Socket.IO (live notifications and cart): WebSocket upgrade, long-lived connections.
    location /api/socket.io/ {
        if ($maintenance) { return 503; }
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/auth/ {
        if ($maintenance) { return 503; }
        limit_req zone=ipdokan_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        if ($maintenance) { return 503; }
        limit_req zone=ipdokan_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        if ($maintenance) { return 503; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
